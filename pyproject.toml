[project]
name = "satbio"
version = "0.1.0"
description = "Sensoriamento remoto e bioacústica em cabruca"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.2",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satbio"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
